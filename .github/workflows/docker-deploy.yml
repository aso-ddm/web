name: Docker Deploy

on:
  push:
    branches:
      - main
      - web2-feature

# main y web2-feature despliegan en el mismo servidor: un despliegue cada vez
concurrency:
  group: docker-deploy
  cancel-in-progress: false

env:
  # Health check desde fuera (nginx → backend → BD): no depende del docker-compose del VPS
  HEALTH_URL: https://test.dragondemadera.com/api/health

jobs:
  # ── Tests: si fallan no se construye ni se despliega nada ─────────────────
  test:
    name: Tests y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm 11 necesita Node >= 22.13; la misma mayor que en local
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Misma versión mayor que en local (lockfile de pnpm 11)
      - name: Instalar pnpm
        run: npm install -g pnpm@11

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma
        run: pnpm exec prisma generate

      # Incluye el test de contrato front ↔ back
      - name: Tests backend
        run: pnpm -C backend test:run

      # Tipos del backend y de sus tests (el build del Dockerfile excluye los tests)
      - name: Tipos backend
        run: pnpm exec tsc -p tsconfig.json

      - name: Tipos frontend
        run: pnpm -C frontend exec tsc --noEmit

      - name: Tests frontend
        run: pnpm -C frontend test

  # ── Build y push de imágenes ──────────────────────────────────────────────
  build-push:
    name: Build & Push ${{ matrix.service }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            image: asoddm/dragondemadera-backend
            dockerfile: backend/Dockerfile
          - service: frontend
            image: asoddm/dragondemadera-frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            VITE_APP_VERSION=1.0.${{ github.run_number }}

  # ── Despliegue en servidor ────────────────────────────────────────────────
  deploy:
    name: Deploy to server
    needs: build-push
    runs-on: ubuntu-latest
    env:
      IMAGES: asoddm/dragondemadera-backend:latest asoddm/dragondemadera-frontend:latest
    steps:
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "SSH=ssh -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" >> "$GITHUB_ENV"

      # Lo que corre ahora queda como :previous para poder volver si el nuevo no arranca
      - name: Guardar imágenes actuales como :previous
        run: |
          $SSH "for img in $IMAGES; do if docker image inspect \"\$img\" >/dev/null 2>&1; then docker tag \"\$img\" \"\${img%:latest}:previous\"; fi; done"

      # El servidor no siempre llega a Docker Hub (13/10/2026: TLS handshake timeout desde el VPS):
      # el runner descarga las imágenes y se las pasa por SSH. Si falla, lo que está corriendo sigue en pie.
      - name: Enviar imágenes al servidor
        run: |
          for img in $IMAGES; do docker pull "$img"; done
          docker save $IMAGES | gzip | $SSH 'gunzip | docker load'

      # db (postgres) ya está en el servidor; up -d no descarga imágenes que existen en local
      - name: Arrancar contenedores
        id: arrancar
        run: $SSH 'set -e; cd /opt/web; docker compose up -d --remove-orphans'

      # El backend aplica las migraciones al arrancar: se le dan hasta 3 minutos
      - name: Verificar que la app responde
        run: |
          for i in $(seq 1 36); do
            if curl -fsS --max-time 10 "$HEALTH_URL"; then echo; echo "OK: $HEALTH_URL responde"; exit 0; fi
            sleep 5
          done
          echo "ERROR: $HEALTH_URL no responde tras el despliegue"
          exit 1

      # Vuelve a las imágenes anteriores. Las migraciones ya aplicadas NO se deshacen: tienen que ser compatibles
      # con la versión anterior (añadir antes de quitar), o la vuelta atrás arrancará sobre un schema que no espera
      - name: Rollback a las imágenes anteriores
        if: failure() && steps.arrancar.outcome == 'success'
        run: |
          $SSH "set -e; cd /opt/web; for img in $IMAGES; do prev=\"\${img%:latest}:previous\"; if docker image inspect \"\$prev\" >/dev/null 2>&1; then docker tag \"\$prev\" \"\$img\"; fi; done; docker compose up -d --remove-orphans"
          sleep 20
          echo "Health tras rollback: $(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$HEALTH_URL")"

      # Solo con el despliegue sano: las imágenes sin etiqueta ya no hacen falta
      - name: Limpiar imágenes antiguas
        if: success()
        run: $SSH 'docker image prune -f'
