name: Deploy

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_PATH: /var/www/dragon-de-madera/dragondemadera

# Un deploy cada vez: dos pushes seguidos no se pisan los backups
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # ── Detectar qué cambió ────────────────────────────────────────────────────
  changes:
    runs-on: self-hosted
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar cambios
        id: filter
        run: |
          # Todos los commits del push, no solo el último
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then BEFORE=HEAD~1; fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD)
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE "^frontend/|^prisma/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -qE "^backend/|^prisma/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  # ── Deploy Frontend ────────────────────────────────────────────────────────
  # Va después del backend: si el backend falla y hace rollback, no se publica un front contra un API antiguo
  deploy-frontend:
    needs: [changes, deploy-backend]
    if: >-
      !cancelled() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Todo el workspace: el test de contrato usa también las dependencias del backend
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos TypeScript
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Tests
        working-directory: frontend
        run: pnpm test

      # El contrato front ↔ back (roles, enums, reglas del registro) vive en los tests del backend:
      # se ejecuta también cuando solo cambia el frontend
      - name: Test de contrato frontend ↔ backend
        working-directory: backend
        run: |
          pnpm exec prisma generate --schema=../prisma/schema.prisma
          pnpm exec vitest run src/__tests__/contrato_frontend.test.ts

      - name: Build
        working-directory: frontend
        env:
          VITE_APP_VERSION: "1.0.${{ github.run_number }}"
        run: pnpm run build

      - name: Verificar que el build no está vacío
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "ERROR: el build no generó index.html"
            exit 1
          fi

      - name: Backup del build anterior
        run: |
          if [ -d "$DEPLOY_PATH/frontend/dist" ]; then
            cp -r "$DEPLOY_PATH/frontend/dist" "$DEPLOY_PATH/frontend/dist.backup"
          fi

      - name: Desplegar build
        run: |
          rm -rf "$DEPLOY_PATH/frontend/dist"
          cp -r frontend/dist "$DEPLOY_PATH/frontend/dist"

      - name: Recargar Nginx
        run: sudo systemctl reload nginx

      - name: Verificar que Nginx responde
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Nginx devuelve $STATUS — ejecutando rollback"
            rm -rf "$DEPLOY_PATH/frontend/dist"
            mv "$DEPLOY_PATH/frontend/dist.backup" "$DEPLOY_PATH/frontend/dist"
            sudo systemctl reload nginx
            exit 1
          fi
          echo "OK: Nginx responde con 200"

      - name: Limpiar backup
        if: success()
        run: rm -rf "$DEPLOY_PATH/frontend/dist.backup"

  # ── Deploy Backend (TypeScript) ────────────────────────────────────────────
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Un solo lockfile (pnpm-lock.yaml) para desarrollo, tests y producción
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar cliente Prisma (CI)
        working-directory: backend
        run: pnpm exec prisma generate --schema=../prisma/schema.prisma

      - name: Tests
        working-directory: backend
        run: pnpm test:run

      - name: Compilar TypeScript
        working-directory: backend
        run: pnpm run build

      - name: Verificar que el build generó dist/server.js
        run: |
          if [ ! -f backend/dist/server.js ]; then
            echo "ERROR: la compilación no generó dist/server.js"
            exit 1
          fi

      # node_modules de producción aislado, resuelto desde pnpm-lock.yaml
      - name: Preparar dependencias de producción
        run: |
          rm -rf backend-prod
          pnpm --filter dragondemadera-backend deploy --prod --legacy backend-prod

      # Se mueve el directorio en vez de copiarlo: el rollback recupera node_modules sin reinstalar.
      # .env y uploads/ viven en $DEPLOY_PATH/backend y no se tocan.
      - name: Backup del backend anterior
        run: |
          B="$DEPLOY_PATH/backend"
          rm -rf "$B/dist.backup" "$B/node_modules.backup" "$DEPLOY_PATH/prisma.backup"
          if [ -d "$B/dist" ]; then cp -r "$B/dist" "$B/dist.backup"; fi
          if [ -d "$B/node_modules" ]; then mv "$B/node_modules" "$B/node_modules.backup"; fi
          if [ -d "$DEPLOY_PATH/prisma" ]; then cp -r "$DEPLOY_PATH/prisma" "$DEPLOY_PATH/prisma.backup"; fi
          cp "$B/package.json" "$B/package.json.backup" 2>/dev/null || true

      - name: Desplegar código compilado
        run: |
          B="$DEPLOY_PATH/backend"
          rm -rf "$B/dist" "$B/package-lock.json"
          cp -r backend/dist "$B/dist"
          cp backend/package.json "$B/package.json"
          cp -a backend-prod/node_modules "$B/node_modules"
          rm -rf "$DEPLOY_PATH/prisma"
          cp -r prisma "$DEPLOY_PATH/prisma"

      # prisma es dependencia de producción del backend: se usa la versión fijada en el lockfile.
      # Las migraciones son solo hacia delante; si una falla, se resuelve a mano (prisma migrate resolve).
      - name: Generar cliente Prisma
        working-directory: ${{ env.DEPLOY_PATH }}/backend
        run: npx prisma generate --schema=../prisma/schema.prisma

      - name: Ejecutar migraciones
        working-directory: ${{ env.DEPLOY_PATH }}/backend
        run: npx prisma migrate deploy --schema=../prisma/schema.prisma

      - name: Reiniciar backend con PM2
        run: |
          if pm2 describe dragon-backend > /dev/null 2>&1; then
            pm2 restart dragon-backend --update-env
          else
            pm2 start "$DEPLOY_PATH/backend/dist/server.js" \
              --name dragon-backend \
              --cwd "$DEPLOY_PATH/backend"
            pm2 save
          fi

      - name: Verificar que el backend responde
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: backend devuelve $STATUS — ejecutando rollback"
            if [ ! -d "$DEPLOY_PATH/backend/dist.backup" ]; then
              echo "No hay backup previo: rollback imposible"
              exit 1
            fi
            B="$DEPLOY_PATH/backend"
            rm -rf "$B/dist" "$B/node_modules"
            cp -r "$B/dist.backup" "$B/dist"
            if [ -d "$B/node_modules.backup" ]; then mv "$B/node_modules.backup" "$B/node_modules"; fi
            if [ -d "$DEPLOY_PATH/prisma.backup" ]; then rm -rf "$DEPLOY_PATH/prisma" && cp -r "$DEPLOY_PATH/prisma.backup" "$DEPLOY_PATH/prisma"; fi
            cp "$B/package.json.backup" "$B/package.json" 2>/dev/null || true
            pm2 restart dragon-backend --update-env
            sleep 3
            echo "Health tras rollback: $(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health)"
            exit 1
          fi
          echo "OK: backend responde con 200"

      - name: Limpiar backups
        if: success()
        run: |
          rm -rf "$DEPLOY_PATH/backend/dist.backup" "$DEPLOY_PATH/backend/node_modules.backup" "$DEPLOY_PATH/prisma.backup"
          rm -f "$DEPLOY_PATH/backend/package.json.backup"
