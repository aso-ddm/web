name: Deploy

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_PATH: /var/www/dragon-de-madera/dragondemadera

jobs:
  # ── Detectar qué cambió ────────────────────────────────────────────────────
  changes:
    runs-on: self-hosted
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detectar cambios
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q "^frontend/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^backend/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  # ── Deploy Frontend ────────────────────────────────────────────────────────
  deploy-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verificar tipos TypeScript
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        run: pnpm run build

      - name: Verificar que el build no está vacío
        run: |
          if [ ! -f frontend/dist/index.html ]; then
            echo "ERROR: el build no generó index.html"
            exit 1
          fi

      - name: Backup del build anterior
        run: |
          if [ -d "$DEPLOY_PATH/frontend/dist" ]; then
            cp -r "$DEPLOY_PATH/frontend/dist" "$DEPLOY_PATH/frontend/dist.backup"
          fi

      - name: Desplegar build
        run: |
          rm -rf "$DEPLOY_PATH/frontend/dist"
          cp -r frontend/dist "$DEPLOY_PATH/frontend/dist"

      - name: Recargar Nginx
        run: sudo systemctl reload nginx

      - name: Verificar que Nginx responde
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Nginx devuelve $STATUS — ejecutando rollback"
            rm -rf "$DEPLOY_PATH/frontend/dist"
            mv "$DEPLOY_PATH/frontend/dist.backup" "$DEPLOY_PATH/frontend/dist"
            sudo systemctl reload nginx
            exit 1
          fi
          echo "OK: Nginx responde con 200"

      - name: Limpiar backup
        if: success()
        run: rm -rf "$DEPLOY_PATH/frontend/dist.backup"

  # ── Deploy Backend (TypeScript) ────────────────────────────────────────────
  deploy-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Generar cliente Prisma (CI)
        working-directory: backend
        run: npx prisma generate

      - name: Compilar TypeScript
        working-directory: backend
        run: npm run build

      - name: Verificar que el build generó dist/index.js
        run: |
          if [ ! -f backend/dist/index.js ]; then
            echo "ERROR: la compilación no generó dist/index.js"
            exit 1
          fi

      - name: Backup del backend anterior
        run: |
          if [ -d "$DEPLOY_PATH/backend/dist" ]; then
            cp -r "$DEPLOY_PATH/backend/dist" "$DEPLOY_PATH/backend/dist.backup"
          fi
          cp "$DEPLOY_PATH/backend/package.json" "$DEPLOY_PATH/backend/package.json.backup" 2>/dev/null || true

      - name: Desplegar código compilado
        run: |
          rm -rf "$DEPLOY_PATH/backend/dist"
          cp -r backend/dist "$DEPLOY_PATH/backend/dist"
          cp backend/package.json "$DEPLOY_PATH/backend/package.json"
          cp backend/package-lock.json "$DEPLOY_PATH/backend/package-lock.json"
          rm -rf "$DEPLOY_PATH/backend/prisma"
          cp -r backend/prisma "$DEPLOY_PATH/backend/prisma"

      - name: Instalar dependencias de producción en servidor
        working-directory: ${{ env.DEPLOY_PATH }}/backend
        run: npm ci --omit=dev

      - name: Generar cliente Prisma
        working-directory: ${{ env.DEPLOY_PATH }}/backend
        run: npx prisma generate

      - name: Resolver migraciones fallidas
        working-directory: ${{ env.DEPLOY_PATH }}/backend
        run: |
          # Lee la DATABASE_URL del .env y consulta directamente _prisma_migrations
          source .env 2>/dev/null || true
          FAILED=$(psql "$DATABASE_URL" -t -c \
            "SELECT migration_name FROM _prisma_migrations WHERE rolled_back_at IS NULL AND finished_at IS NULL AND started_at IS NOT NULL;" \
            2>/dev/null | tr -d ' ' | grep -v '^$' || true)
          if [ -n "$FAILED" ]; then
            echo "Migraciones fallidas: $FAILED"
            for m in $FAILED; do
              echo "Marcando $m como rolled-back..."
              npx prisma migrate resolve --rolled-back "$m"
            done
          else
            echo "No hay migraciones fallidas"
          fi

      - name: Ejecutar migraciones
        working-directory: ${{ env.DEPLOY_PATH }}/backend
        run: npm run prisma:migrate

      - name: Reiniciar backend con PM2
        run: |
          if pm2 describe dragon-backend > /dev/null 2>&1; then
            pm2 restart dragon-backend --update-env
          else
            pm2 start "$DEPLOY_PATH/backend/dist/index.js" \
              --name dragon-backend \
              --cwd "$DEPLOY_PATH/backend"
            pm2 save
          fi

      - name: Verificar que el backend responde
        run: |
          sleep 3
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health)
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: backend devuelve $STATUS — ejecutando rollback"
            rm -rf "$DEPLOY_PATH/backend/dist"
            cp -r "$DEPLOY_PATH/backend/dist.backup" "$DEPLOY_PATH/backend/dist"
            cp "$DEPLOY_PATH/backend/package.json.backup" "$DEPLOY_PATH/backend/package.json" 2>/dev/null || true
            npm ci --prefix "$DEPLOY_PATH/backend"
            pm2 restart dragon-backend --update-env
            exit 1
          fi
          echo "OK: backend responde con 200"

      - name: Limpiar backups
        if: success()
        run: |
          rm -rf "$DEPLOY_PATH/backend/dist.backup"
          rm -f "$DEPLOY_PATH/backend/package.json.backup"
