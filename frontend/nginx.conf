server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://dragondemadera_backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Si hay otro proxy delante (proxy_network), $remote_addr es su IP y el rate limit de /auth
        # metería a todos en el mismo cubo: usar set_real_ip_from <subred> + real_ip_header X-Forwarded-For
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets con hash: inmutables, y 404 real si ya no existen (no index.html)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html siempre fresco, para que apunte a los chunks del último deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
