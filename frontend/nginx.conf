server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Delante hay otro proxy (openresty en proxy_network): sin esto $remote_addr es su IP y el
    # rate limit de /auth mete a todos los usuarios en el mismo cubo. Solo él llega por red privada.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://dragondemadera_backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr ya es la IP del cliente (ver set_real_ip_from arriba)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets con hash: inmutables, y 404 real si ya no existen (no index.html)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html siempre fresco, para que apunte a los chunks del último deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
